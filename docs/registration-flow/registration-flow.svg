<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 922" width="1640" height="922" font-family="Arial, Helvetica, sans-serif">
<title>Registration flow (planned), regular path and edge cases</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="ae" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
</defs>
<rect width="1640" height="922" fill="#ffffff"/>
<rect x="0" y="50" width="1640" height="200" fill="#f3f3f3" stroke="#d0d0d0"/>
<text x="14" y="146.0" font-size="15" font-weight="bold" fill="#222"><tspan x="14" dy="0">Registrant</tspan><tspan x="14" dy="18">(browser)</tspan></text>
<rect x="0" y="260" width="1640" height="310" fill="#fafafa" stroke="#d0d0d0"/>
<text x="14" y="402.0" font-size="15" font-weight="bold" fill="#222"><tspan x="14" dy="0">Registration</tspan><tspan x="14" dy="18">service</tspan><tspan x="14" dy="18">(fly.io)</tspan></text>
<rect x="0" y="580" width="1640" height="180" fill="#f3f3f3" stroke="#d0d0d0"/>
<text x="14" y="666.0" font-size="15" font-weight="bold" fill="#222"><tspan x="14" dy="0">Mail</tspan><tspan x="14" dy="18">(Mailjet)</tspan></text>
<rect x="0" y="770" width="1640" height="142" fill="#fafafa" stroke="#d0d0d0"/>
<text x="14" y="837.0" font-size="15" font-weight="bold" fill="#222"><tspan x="14" dy="0">Back office</tspan><tspan x="14" dy="18">(inbox)</tspan></text>
<text x="14" y="32" font-size="18" font-weight="bold" fill="#222">Registration flow (planned)</text>
<line x1="965" y1="44" x2="965" y2="912" stroke="#888" stroke-dasharray="6 5"/>
<text x="540" y="32" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">1  Register</text>
<text x="1295" y="32" font-size="16" font-weight="bold" fill="#222" text-anchor="middle">2  Confirm</text>
<rect x="140" y="62" width="180" height="76" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="230.0" y="80.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="230.0" dy="0" font-weight="bold">Date card</tspan><tspan x="230.0" dy="16">Register (open) or</tspan><tspan x="230.0" dy="16">Join waiting list</tspan><tspan x="230.0" dy="16">(waitlist)</tspan></text>
<rect x="140" y="168" width="180" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="230.0" y="194.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="230.0" dy="0" font-weight="bold">Registration form</tspan><tspan x="230.0" dy="16">fill in, submit</tspan></text>
<rect x="755" y="70" width="180" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="845.0" y="98.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="845.0" dy="0" font-weight="bold">Success page</tspan><tspan x="845.0" dy="16">please check your inbox</tspan></text>
<rect x="1010" y="62" width="160" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1090.0" y="90.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="1090.0" dy="0" font-weight="bold">Registrant mail</tspan><tspan x="1090.0" dy="16">click confirm link</tspan></text>
<rect x="1010" y="150" width="160" height="82" rx="6" fill="#ffffff" stroke="#b03a2e" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="1090.0" y="172.7" font-size="12" fill="#222" text-anchor="middle"><tspan x="1090.0" dy="0">Link scanner (e.g.</tspan><tspan x="1090.0" dy="15">Safe Links) opens</tspan><tspan x="1090.0" dy="15">the link: page only,</tspan><tspan x="1090.0" dy="15">nothing confirmed</tspan></text>
<rect x="1200" y="62" width="180" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1290.0" y="90.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="1290.0" dy="0" font-weight="bold">Confirm page</tspan><tspan x="1290.0" dy="16">course facts + button</tspan></text>
<rect x="1420" y="62" width="180" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1510.0" y="90.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="1510.0" dy="0" font-weight="bold">Confirmed page</tspan><tspan x="1510.0" dy="16">thank you</tspan></text>
<rect x="140" y="285" width="180" height="76" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="230.0" y="311.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="230.0" dy="0" font-weight="bold">Checks</tspan><tspan x="230.0" dy="16">size, origin,</tspan><tspan x="230.0" dy="16">honeypots, rate limit</tspan></text>
<rect x="345" y="285" width="180" height="76" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="435.0" y="311.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="435.0" dy="0" font-weight="bold">Required fields</tspan><tspan x="435.0" dy="16">present, email</tspan><tspan x="435.0" dy="16">syntax valid?</tspan></text>
<rect x="550" y="285" width="180" height="76" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="640.0" y="311.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="640.0" dy="0" font-weight="bold">Booking code bookable?</tspan><tspan x="640.0" dy="16">(open or waitlist,</tspan><tspan x="640.0" dy="16">not past)</tspan></text>
<rect x="755" y="285" width="180" height="76" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="845.0" y="311.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="845.0" dy="0" font-weight="bold">Seal token</tspan><tspan x="845.0" dy="16">id, code, email, name,</tspan><tspan x="845.0" dy="16">language; 5 days</tspan></text>
<rect x="140" y="420" width="180" height="76" rx="6" fill="#ffffff" stroke="#b03a2e" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="230.0" y="447.2" font-size="12" fill="#222" text-anchor="middle"><tspan x="230.0" dy="0">Silent drop:</tspan><tspan x="230.0" dy="15">reason logged, no mail,</tspan><tspan x="230.0" dy="15">success page shown</tspan></text>
<rect x="345" y="420" width="180" height="60" rx="6" fill="#ffffff" stroke="#b03a2e" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="435.0" y="446.7" font-size="12" fill="#222" text-anchor="middle"><tspan x="435.0" dy="0">Redirect to</tspan><tspan x="435.0" dy="15">fail page</tspan></text>
<rect x="550" y="420" width="180" height="120" rx="6" fill="#ffffff" stroke="#b03a2e" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="640.0" y="446.7" font-size="12" fill="#222" text-anchor="middle"><tspan x="640.0" dy="0">Unknown code:</tspan><tspan x="640.0" dy="15">silent drop.</tspan><tspan x="640.0" dy="15">Closed since page load,</tspan><tspan x="640.0" dy="15">or feed unreachable:</tspan><tspan x="640.0" dy="15">continue, flagged</tspan><tspan x="640.0" dy="15">in the notes</tspan></text>
<rect x="1010" y="285" width="160" height="76" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1090.0" y="311.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="1090.0" dy="0" font-weight="bold">GET /confirm</tspan><tspan x="1090.0" dy="16">token intact and</tspan><tspan x="1090.0" dy="16">not expired?</tspan></text>
<rect x="1010" y="420" width="160" height="60" rx="6" fill="#ffffff" stroke="#b03a2e" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="1090.0" y="446.7" font-size="12" fill="#222" text-anchor="middle"><tspan x="1090.0" dy="0">Error page</tspan><tspan x="1090.0" dy="15">+ mailto info@arc42.de</tspan></text>
<rect x="1200" y="285" width="180" height="76" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1290.0" y="319.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="1290.0" dy="0" font-weight="bold">POST /confirm</tspan><tspan x="1290.0" dy="16">button pressed</tspan></text>
<rect x="1420" y="285" width="180" height="76" rx="6" fill="#ffffff" stroke="#b03a2e" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="1510.0" y="312.2" font-size="12" fill="#222" text-anchor="middle"><tspan x="1510.0" dy="0">Pressed twice:</tspan><tspan x="1510.0" dy="15">second CONFIRMED,</tspan><tspan x="1510.0" dy="15">harmless</tspan></text>
<rect x="755" y="592" width="180" height="156" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="845.0" y="618.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="845.0" dy="0" font-weight="bold">Send via Mailjet</tspan><tspan x="845.0" dy="16">from trainings@arc42.org</tspan><tspan x="845.0" dy="16"></tspan><tspan x="845.0" dy="16">1  UNCONFIRMED</tspan><tspan x="845.0" dy="16">to back office</tspan><tspan x="845.0" dy="16">2  course details +</tspan><tspan x="845.0" dy="16">confirm link (+ waiting-</tspan><tspan x="845.0" dy="16">list note) to registrant</tspan></text>
<rect x="550" y="600" width="180" height="100" rx="6" fill="#ffffff" stroke="#b03a2e" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="640.0" y="624.2" font-size="12" fill="#222" text-anchor="middle"><tspan x="640.0" dy="0">Back-office mail fails:</tspan><tspan x="640.0" dy="15">fail page shown.</tspan><tspan x="640.0" dy="15">Registrant mail fails:</tspan><tspan x="640.0" dy="15">success page anyway,</tspan><tspan x="640.0" dy="15">back office follows up</tspan></text>
<rect x="1200" y="620" width="180" height="64" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1290.0" y="648.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="1290.0" dy="0" font-weight="bold">Send via Mailjet</tspan><tspan x="1290.0" dy="16">CONFIRMED to back office</tspan></text>
<rect x="755" y="790" width="180" height="100" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="845.0" y="828.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="845.0" dy="0" font-weight="bold">UNCONFIRMED arrives</tspan><tspan x="845.0" dy="16">full data, R- id,</tspan><tspan x="845.0" dy="16">suspicion notes</tspan></text>
<rect x="1010" y="790" width="160" height="100" rx="6" fill="#ffffff" stroke="#b03a2e" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="1090.0" y="821.7" font-size="12" fill="#222" text-anchor="middle"><tspan x="1090.0" dy="0">No CONFIRMED after</tspan><tspan x="1090.0" dy="15">2 to 3 working days:</tspan><tspan x="1090.0" dy="15">follow up if plausible,</tspan><tspan x="1090.0" dy="15">ignore if fake</tspan></text>
<rect x="1200" y="790" width="180" height="100" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="1290.0" y="828.55" font-size="13" fill="#222" text-anchor="middle"><tspan x="1290.0" dy="0" font-weight="bold">CONFIRMED arrives</tspan><tspan x="1290.0" dy="16">same R- id: book,</tspan><tspan x="1290.0" dy="16">personal reply</tspan></text>
<rect x="1420" y="610" width="40" height="22" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="1470" y="626" font-size="13" fill="#222">regular path</text>
<rect x="1420" y="645" width="40" height="22" rx="4" fill="#fff" stroke="#b03a2e" stroke-dasharray="5 4" stroke-width="1.5"/><text x="1470" y="661" font-size="13" fill="#222">edge case</text>
<text x="1420" y="700" font-size="12" fill="#444"><tspan x="1420" dy="0">Waiting-list dates take the</tspan><tspan x="1420" dy="15">same path; the registrant</tspan><tspan x="1420" dy="15">mail adds a waiting-list note.</tspan></text>
<text x="1420" y="812" font-size="12" fill="#444"><tspan x="1420" dy="0">All mails use the language of</tspan><tspan x="1420" dy="15">the registration. German ones</tspan><tspan x="1420" dy="15">say UNBESTÄTIGT / BESTÄTIGT.</tspan></text>
