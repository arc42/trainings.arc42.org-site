# Deployed from admin-app/. There is no [mounts] section and there never should
# be: the app keeps no state. Drafts live in memory and are meant to be
# disposable; everything published is a commit in the repository.
app = "arc42-trainings-admin"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  ENVIRONMENT = "PRODUCTION"
  GITHUB_REPO = "arc42/trainings.arc42.org-site"
  # Must match the arc42-trainings-admin-prod OAuth app's registered callback,
  # which is this value + "/auth/callback". Change both together, or GitHub
  # rejects the redirect_uri. Defaults to the fly.dev host if unset; set it
  # explicitly when moving to a custom domain.
  PUBLIC_URL = "https://arc42-trainings-admin.fly.dev"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"
