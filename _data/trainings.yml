# ============================================================================
# SINGLE SOURCE OF TRUTH for all arc42 training dates.
# Edit THIS file (via PR) to change dates everywhere:
#   - trainings.arc42.org home page + /api/trainings.json  (Jekyll build)
#   - arc42.de termine page + registration forms (pulled by its refresh workflow)
# Keep start/end QUOTED "YYYY-MM-DD" strings. Quote country codes ("NO" is false!).
# language (de|en) is REQUIRED on every date - no default, validation fails loudly.
# url_en (optional, per course) = English detail page, https://trainings.arc42.org/courses/<id>/
#
# NO PROSE WITHOUT A STATED LANGUAGE. Everything here is rendered on German AND
# English pages, so a hand-written sentence of unknown language is wrong on half
# of them. Sentences live in _includes/*-label.html, which branch on the page
# language. This is why price, credits and few_seats are numbers and flags
# rather than the strings they used to be.
#
# The one exception is the course description: blurb_de (German) and blurb_en
# (English), per course, both optional. The language is in the key name, so a
# consumer picks the right one and never renders a German sentence to an
# English reader. The old single `blurb` is retired (the validator rejects it);
# the feed still publishes a generated `blurb` (blurb_en, else blurb_de).
#
# show_on (optional, per course) = list of consumer sites that advertise the
# course. Absent means every consumer site. An empty list is an error.
# trainings.arc42.org ignores it and shows every course. Known names:
# faq.arc42.org, docs.arc42.org, arc42.org, examples.arc42.org, www.arc42.de,
# softwareknigge.arc42.org, www.gernotstarke.de, www.systems42.org
# (other names are allowed: lowercase letters, digits, dots, hyphens).
#
#   price:                     credit_points:      seats_limited: true
#     amount: 2890               methodical: 20
#     currency: EUR              technical: 10     (also: communication)
#     alumni: 2050             (optional, the reduced price for former
#     early_bird:               participants; omit it when there is none)
#       amount: 2690
#       until: "2026-11-02"    <- QUOTED "YYYY-MM-DD", like start/end
#
# EVERY bookable date carries a price. Four card templates used to hold a
# hardcoded bilingual sentence instead ("Normalpreis: € 2200 (für unsere
# Alumni € 2050)"), which meant the price never reached /api/trainings.json,
# the consumer sites showed none, and the booking summary on the
# registration page disagreed with the card next to it.
#
# early_bird.until is compared against the build date by
# _includes/price-label.html, so an expired offer stops being advertised on its
# own. It does NOT need deleting when it lapses, and it must not be left as a
# sentence: the previous free-text version quoted "bis 8. August 2026" into
# September because no machine could see the deadline inside the string.
# Weekly rebuilds (.github/workflows/weekly-refresh.yml) bound the staleness to
# one Monday, exactly as they already do for dates that have passed.
# ============================================================================
