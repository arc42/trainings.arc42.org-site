name: Validate training data
on:
  push:
    branches: ["**"]
    paths: ["_data/trainings.yml", "api/trainings.schema.json", "api/trainings.json", "scripts/**", "_includes/registration-form.html", "_includes/training-date-label.html"]
  pull_request:
    paths: ["_data/trainings.yml", "api/trainings.schema.json", "api/trainings.json", "scripts/**", "_includes/registration-form.html", "_includes/training-date-label.html"]
jobs:
  validate:
    if: github.repository == 'arc42/trainings.arc42.org-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Validate trainings.yml (structure, language, dates)
        run: ruby scripts/validate_trainings.rb
      - name: Build site
        run: bundle exec jekyll build
      - name: Validate published JSON against schema
        run: npx --yes ajv-cli@5 validate -s api/trainings.schema.json -d _site/api/trainings.json
