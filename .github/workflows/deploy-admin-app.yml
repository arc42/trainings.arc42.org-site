name: Admin app

# Tests run on every pull request that touches the app, and again on main
# before deploying. Without the pull_request trigger the Go suite only ran
# after merge, so a broken change merged green and first failed on the way to
# fly — the review saw no signal at all.
on:
  push:
    branches: [main]
    paths: ["admin-app/**", ".github/workflows/deploy-admin-app.yml"]
  pull_request:
    paths: ["admin-app/**", ".github/workflows/deploy-admin-app.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # go.sum is not at the repo root; without this the cache step warns
          # "Dependencies file is not found" on every run.
          cache-dependency-path: admin-app/go.sum
      # Ruby 3.3 matches the version validate-trainings.yml already pins, so
      # the anti-drift cross-check runs against the same interpreter CI uses
      # elsewhere in this repo.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Test
        working-directory: admin-app
        run: go test ./... -v
      - name: Vet
        working-directory: admin-app
        run: go vet ./...
      - name: Gofmt
        working-directory: admin-app
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite:"; echo "$unformatted"; exit 1
          fi

  deploy:
    needs: test
    # Never from a pull request: a PR builds and tests, it does not ship.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-admin-app
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        working-directory: admin-app
        # Exits gracefully when the secret is absent, the same way
        # notify-consumers.yml handles CONSUMER_DISPATCH_TOKEN. Until the fly
        # app exists there is nothing to deploy to, and a red run on every push
        # to admin-app/** trains people to ignore this workflow.
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice title=Deploy skipped::FLY_API_TOKEN is not set. Create the fly app and add the secret to enable deployment."
            exit 0
          fi
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
