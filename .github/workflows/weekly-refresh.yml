name: Weekly Pages rebuild
# Why this exists at all: the home-page timeline and the registration-form
# <select>s filter dates against `today` AT BUILD TIME. A date passing its `end`
# touches no git history, so without a periodic rebuild this site would keep
# advertising ended courses until some unrelated commit happened to land.
#
# It used to work by regenerating _includes/_subtle-ads.html and pushing the
# result — the push was what triggered the Pages rebuild. That fragment was
# retired (zero consumers since 2026-08), so the rebuild is now requested
# directly instead of as a side effect of a bot commit. Same guarantee, no
# generated artifact and no synthetic commit in the history.
#
# The four consumer sites do NOT depend on this: they filter expired dates
# themselves when their own refresh-trainings.yml pulls the feed.
on:
  schedule:
    - cron: "43 4 * * 1"   # Mondays 04:43 UTC
  workflow_dispatch:
permissions:
  pages: write
jobs:
  rebuild:
    if: github.repository == 'arc42/trainings.arc42.org-site'
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        # Legacy Pages mode builds on push; this endpoint asks for the same
        # build without one. A failure here means stale dates on the site, not
        # a broken page, so it is worth a red run but not an alarm.
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
