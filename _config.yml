# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.


# "arc42" is this site's own skin (_sass/oneflow/skins/_arc42.scss): the family
# typography pair and the dusty-rose signature hue from meta.arc42.org BRAND.md.
# The nine stock OneFlow skins were removed to trim dead theme weight; only
# "arc42" and the theme's "default" fallback exist. To revert to the stock
# theme look, set oneflow-skin: "default" — any other stock name now fails
# the Sass build with a missing-import error.
oneflow-skin    : "arc42"

# Site Settings
locale                   : "en-US"
title                    : "arc42"
title_separator          : "-"
subtitle                 : " " # Displayed in the masthead below the title, use " " for no subtitle
url                      : "https://trainings.arc42.org" # the base hostname & protocol for your site
baseurl                  : # the subpath of your site, e.g. "/blog"
repository               : "arc42/trainings.arc42.org-site" # GitHub username/repo-name
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : "/images/arc42-logo-white.svg" # Site logo displayed in the masthead.
                                # The light-on-band variant (BRAND.md → Assets: "Variants needed
                                # per site: dark (on paper) and light (on band)"). The old
                                # arc42-site-logo.webp is the dark-on-white mark and is unreadable
                                # on a saturated band; it stays in /images for other uses.
show-popup               : false # set to true to show the cookie-banner / cdn-usage popup.
                                # Edit the popup itself in the respective /includes file
masthead_title           : " "  # Overrides the website title displayed in the masthead, use " " for no title
sticky-masthead          : true # if true, masthead/navigation bar will stay visible when the user scrolls down.
                                # if false, it will move out of sight when scrolling.
masthead-opacity         : 1    # MUST stay 1. DESIGN.md §2.2 makes the masthead a *solid* fill in
                                # the signature hue, and the measured 5.69:1 of white-on-band only
                                # holds if the band is opaque; at 0.85 the page scrolling underneath
                                # composites into it and the ratio becomes whatever the content is.
background-image         : # '/assets/images/header.webp' # Remove / out-comment, if you don't want a background image
background-image-mobile  : # '/assets/images/header.webp' # If you want a different (e.g upright) background image for mobile
background-image-overlay : rgba(255, 255, 255, 0.5) # Set overlay for the background image



# Site Footer: no config. _includes/footer.html carries the link list,
# the sponsor mark and the copyright line literally, matching arc42.org.


# Reading Files
include:
  - .htaccess
  - _pages
# Anything not listed here is copied verbatim into _site/ and served publicly.
# Two entries below are load-bearing rather than cosmetic:
#   - admin-app: the Go source of the trainings admin app. Without this line
#     https://trainings.arc42.org/admin-app/main.go serves the app's source.
#   - docs: the design specs. Repository documents, not site content.
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - admin-app
  # Local output of `make app-demo` and `make app-preview`. Gitignored, but
  # Jekyll would still copy whatever is lying there into _site — where
  # html-proofer then checks the admin app's pages as if they were site pages.
  - demo-out
  - preview-out
  - docs
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - CRUSH.md
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style



# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache



# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "page"

