<!DOCTYPE html>
<html lang="{{.Lang}}"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.T.Title}}</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#222;background:#fff;max-width:560px;margin:40px auto;padding:0 16px}
.addr{font-weight:bold;word-break:break-all}
.err{color:#b03a2e}
input[type=email]{font-size:16px;padding:6px 8px;width:100%;max-width:360px;box-sizing:border-box}
button{font-size:16px;padding:8px 16px;background:#1f4e79;color:#fff;border:0;border-radius:4px;cursor:pointer;margin-top:8px}
</style></head>
<body>
<h1>{{.T.Title}}</h1>
<p>{{.T.Sent}} <span class="addr">{{.Email}}</span> {{.T.SentTail}}</p>
<p>{{.T.NoMail}}</p>
{{if .Exhausted}}
<p>{{.T.Exhausted}} <a href="mailto:info@arc42.de">info@arc42.de</a></p>
{{else}}
<form method="post" action="/correct">
<p><label for="email">{{.T.Wrong}}</label></p>
{{if .Invalid}}<p class="err">{{.T.Invalid}}</p>{{end}}
<input type="hidden" name="t" value="{{.Token}}">
<input type="email" id="email" name="email" required autocomplete="email">
<br><button type="submit">{{.T.Button}}</button>
</form>
{{end}}
<p><a href="{{.Back}}">{{.T.Back}}</a></p>
</body></html>
