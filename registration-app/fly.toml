# The registration service. No [mounts]: pending registrations live inside
# the sealed links (internal/token), and the little state there is (confirmed
# ids, wrong-code counts) is in Turso (internal/store), not on this machine.
app = "arc42-registration"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero by suspending, not stopping: a stopped machine boots again
  # in about 1.7 s on the first submit after an idle spell, which with the two
  # mails made "Anmeldung absenden" take 3 to 5 s (test, 29 Sep 2026). A
  # suspended one resumes from a memory snapshot. Same cost: suspended
  # machines are billed for storage only (docs.fly.io/reference/suspend-resume,
  # "Billing"). Nothing is kept on disk, so the disk not being reset on
  # suspend does not matter.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[env]
  # TEST MODE until the switch-over PR (spec 7.2, stage 5). Without
  # ENVIRONMENT=PRODUCTION the app refuses to start unless TEST_RECIPIENTS is
  # set, so this deployment cannot mail anyone outside the list.
  ENVIRONMENT = "TEST"
  # Confirm links go out under register.arc42.org already in test mode
  # (certificate issued 27 Sep 2026): a mail from trainings@arc42.org whose
  # button leads to *.fly.dev is the sender/link mismatch corporate filters
  # flag, and the end-to-end test should measure what go-live will send.
  PUBLIC_URL = "https://register.arc42.org"
  SITE_URL = "https://trainings.arc42.org"
  FEED_URL = "https://trainings.arc42.org/api/trainings.json"
  ALLOWED_ORIGINS = "https://trainings.arc42.org,http://localhost:4260"
  # Set with `fly secrets import`, never here: MJ_APIKEY_PUBLIC,
  # MJ_APIKEY_PRIVATE and TOKEN_KEY are secret; BACKOFFICE_TO and
  # TEST_RECIPIENTS are personal mail addresses, and this repository is public.

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"
