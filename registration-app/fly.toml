# The registration service. No [mounts]: pending registrations live inside
# the sealed links (internal/token), and the little state there is (confirmed
# ids, wrong-code counts) is in Turso (internal/store), not on this machine.
app = "arc42-registration"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero by suspending, not stopping: a stopped machine boots again
  # in about 1.7 s on the first submit after an idle spell, which with the two
  # mails made "Anmeldung absenden" take 3 to 5 s (test, 29 Sep 2026). A
  # suspended one resumes from a memory snapshot. Same cost: suspended
  # machines are billed for storage only (docs.fly.io/reference/suspend-resume,
  # "Billing"). Nothing is kept on disk, so the disk not being reset on
  # suspend does not matter.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[env]
  # PRODUCTION since the go-live (Plan 3, Task 2). Production refuses to
  # start without Turso (TURSO_DATABASE_URL/TURSO_AUTH_TOKEN) and has no
  # allow-list: TEST_RECIPIENTS must be unset, or every subject would carry
  # [TEST] and strangers' confirmation mails would be withheld.
  ENVIRONMENT = "PRODUCTION"
  # Confirm links under register.arc42.org (certificate since 27 Sep 2026):
  # a mail from trainings@arc42.org whose button led to *.fly.dev would be the
  # sender/link mismatch corporate filters flag.
  PUBLIC_URL = "https://register.arc42.org"
  SITE_URL = "https://trainings.arc42.org"
  FEED_URL = "https://trainings.arc42.org/api/trainings.json"
  # Only the real site: a local page (make reg-demo) posts to a local service.
  ALLOWED_ORIGINS = "https://trainings.arc42.org"
  # Set with `fly secrets import`, never here: TOKEN_KEY, BREVO_API_KEY (or
  # the MJ_ pair), TURSO_AUTH_TOKEN are secret; BACKOFFICE_TO is a personal
  # mail address, and this repository is public. MAILER and
  # TURSO_DATABASE_URL are secrets too, so a switch needs no commit.

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"
